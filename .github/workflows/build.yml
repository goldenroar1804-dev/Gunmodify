name: Build Gun Modifier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find and build project
        run: |
          PROJECT=$(find . -name "*.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "No C# project found. Add the GunModifier project first."
            exit 1
          fi

          dotnet build "$PROJECT" --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: GunModifier-DLL
          path: |
            **/bin/Release/**/*.dll
          if-no-files-found: error
